apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: webapp-prod
resources:
  - ../../base
  - namespace.yaml
labels:
  - pairs:
      environment: prod
    includeSelectors: false
    includeTemplates: true
replicas:
  - name: webapp
    count: 3
images:
  - name: nginx
    newTag: "1.26-alpine"
configMapGenerator:
  - name: web-content
    behavior: replace
    files:
      - index.html
patches:
  - path: patch-resources.yaml
