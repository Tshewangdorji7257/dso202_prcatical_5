apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: webapp-qa
resources:
  - ../../base
  - namespace.yaml
labels:
  - pairs:
      environment: qa
    includeSelectors: false
    includeTemplates: true
replicas:
  - name: webapp
    count: 2
images:
  - name: nginx
    newTag: "1.25-alpine"
configMapGenerator:
  - name: web-content
    behavior: replace
    files:
      - index.html
patches:
  - path: patch-annotation.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: webapp